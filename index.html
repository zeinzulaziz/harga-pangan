<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harga Produsen Pangan — SISKAPERBAPO Jawa Timur</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a; --card: #1e293b; --card-hover: #273549;
      --accent: #38bdf8; --accent2: #818cf8; --accent3: #f472b6;
      --accent4: #34d399; --accent5: #fb923c; --accent6: #a78bfa;
      --text: #f1f5f9; --text-dim: #94a3b8; --border: #334155;
      --green: #22c55e; --red: #ef4444;
    }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .hero { background: linear-gradient(135deg, #0f172a 0%, #1a2e1a 50%, #0f172a 100%); padding: 2rem 1.5rem; text-align: center; border-bottom: 1px solid var(--border); }
    .hero h1 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 800; background: linear-gradient(135deg, var(--accent4), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero p { color: var(--text-dim); font-size: 0.9rem; margin-top: 0.3rem; }
    .badge-row { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-top: 0.75rem; }
    .badge { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); color: var(--accent4); padding: 0.2rem 0.7rem; border-radius: 999px; font-size: 0.75rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .tab { padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-dim); font-family: inherit; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .tab:hover { border-color: var(--accent4); color: var(--text); }
    .tab.active { background: var(--accent4); color: #0f172a; border-color: var(--accent4); font-weight: 600; }
    .filter-bar { display: flex; gap: 0.4rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
    .filter-bar label { font-size: 0.8rem; color: var(--text-dim); font-weight: 500; margin-right: 0.3rem; }
    .filter-btn { padding: 0.35rem 0.8rem; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text-dim); font-family: inherit; font-size: 0.78rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 600; }
    .zoom-btn { padding: 0.35rem 0.6rem; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text-dim); font-family: inherit; font-size: 0.78rem; cursor: pointer; transition: all 0.2s; margin-left: auto; }
    .zoom-btn:hover { background: var(--accent5); color: #0f172a; border-color: var(--accent5); }
    .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: 0.5rem; flex-wrap: wrap; }
    .chart-title { font-size: 1rem; font-weight: 600; }
    .chart-subtitle { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.15rem; }
    .chart-wrap { position: relative; }
    .chart-wrap canvas { max-width: 100%; touch-action: pan-y; }
    .stats-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .stat { background: rgba(51,65,85,0.4); border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 0.8rem; }
    .stat-label { color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; }
    .stat-value { font-weight: 700; color: var(--accent4); font-size: 1rem; }
    .legend-box { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--text-dim); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .zoom-hint { font-size: 0.7rem; color: var(--text-dim); text-align: center; margin-top: 0.5rem; }
    .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.8rem; color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .toast.success { border-left: 3px solid var(--green); } .toast.error { border-left: 3px solid var(--red); }
    footer { text-align: center; padding: 1.5rem; color: var(--text-dim); font-size: 0.75rem; border-top: 1px solid var(--border); }
    footer a { color: var(--accent4); }
    @media (max-width: 640px) {
      .hero { padding: 1.5rem 1rem; }
      .tabs { gap: 0.35rem; }
      .tab { padding: 0.4rem 0.7rem; font-size: 0.75rem; }
      .chart-card { padding: 0.75rem; }
      .filter-btn { padding: 0.3rem 0.6rem; font-size: 0.72rem; }
    }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<header class="hero">
  <h1>Harga Produsen Pangan Jawa Timur</h1>
  <p>Data harga produsen harian dari SISKAPERBAPO</p>
  <div class="badge-row">
    <span class="badge" id="updateBadge">Memuat...</span>
    <span class="badge">Sumber: siskaperbapo.jatimprov.go.id</span>
    <span class="badge" id="commodityBadge"></span>
  </div>
</header>

<main class="container">
  <div class="tabs" id="commodityTabs"></div>

  <div id="statsRow" class="stats-row"></div>

  <div id="legendBox" class="legend-box"></div>

  <div class="filter-bar">
    <label>Periode:</label>
    <button class="filter-btn" data-period="1w">1 Minggu</button>
    <button class="filter-btn" data-period="1m">1 Bulan</button>
    <button class="filter-btn" data-period="3m">3 Bulan</button>
    <button class="filter-btn" data-period="6m">6 Bulan</button>
    <button class="filter-btn" data-period="1y">1 Tahun</button>
    <button class="filter-btn active" data-period="all">Semua</button>
    <button class="zoom-btn" id="resetZoomBtn" title="Reset zoom">↺ Reset Zoom</button>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <div>
        <div class="chart-title" id="chartTitle">Tren Harga</div>
        <div class="chart-subtitle" id="chartSubtitle">Harga produsen per kg (Rp)</div>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="priceChart"></canvas></div>
    <div class="zoom-hint">Scroll untuk zoom | Drag untuk geser | Double-click untuk reset</div>
  </div>
</main>

<footer>
  <small>Data dari <a href="https://siskaperbapo.jatimprov.go.id/produsen/tabel" target="_blank">SISKAPERBAPO Jatim</a> | Diperbarui otomatis setiap hari</small>
</footer>

<script>
const R = n => n ? 'Rp' + n.toLocaleString('id-ID') : '-';
const COLORS = ['#38bdf8','#818cf8','#f472b6','#34d399','#fb923c','#a78bfa','#eab308','#ef4444'];
let data = null;
let currentCommodity = null;
let currentPeriod = 'all';
let chart = null;

function showToast(msg, type = 'info') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

function getFilteredDates(allDates) {
  if (currentPeriod === 'all') return allDates;
  const now = new Date();
  let cutoff;
  switch (currentPeriod) {
    case '1w': cutoff = new Date(now - 7 * 86400000); break;
    case '1m': cutoff = new Date(now - 30 * 86400000); break;
    case '3m': cutoff = new Date(now - 90 * 86400000); break;
    case '6m': cutoff = new Date(now - 180 * 86400000); break;
    case '1y': cutoff = new Date(now - 365 * 86400000); break;
    default: return allDates;
  }
  const cutoffStr = cutoff.toISOString().slice(0, 10);
  return allDates.filter(d => d >= cutoffStr);
}

function renderTabs() {
  const container = document.getElementById('commodityTabs');
  const commodities = Object.keys(data.commodities);
  container.innerHTML = commodities.map((c, i) =>
    `<button class="tab ${c === currentCommodity ? 'active' : ''}" data-commodity="${c}" style="border-color:${COLORS[i % COLORS.length]}">${c}</button>`
  ).join('');
  container.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCommodity = btn.dataset.commodity;
      renderTabs();
      renderStats();
      renderChart();
    });
  });
}

function renderStats() {
  const commodity = data.commodities[currentCommodity];
  if (!commodity) return;
  const allDates = Object.keys(commodity.prices).sort();
  const dates = getFilteredDates(allDates);
  const allValues = [];
  for (const d of dates) {
    for (const v of commodity.prices[d]) {
      if (v != null && v > 0) allValues.push(v);
    }
  }

  const latest = dates[dates.length - 1];
  const latestPrices = commodity.prices[latest] || [];
  const avg = allValues.length > 0 ? Math.round(allValues.reduce((a, b) => a + b, 0) / allValues.length) : null;
  const hi = allValues.length > 0 ? Math.max(...allValues) : null;
  const lo = allValues.length > 0 ? Math.min(...allValues) : null;

  let latestHtml = '';
  if (commodity.columns && commodity.columns.length > 0) {
    latestHtml = latestPrices.map((p, i) => {
      if (p == null) return '';
      const colName = commodity.columns[i] || `Kolom ${i + 1}`;
      return `<div class="stat"><div class="stat-label">${colName}</div><div class="stat-value">${R(p)}</div></div>`;
    }).join('');
  } else {
    latestHtml = latestPrices.map((p, i) =>
      p != null ? `<div class="stat"><div class="stat-label">Data ${i + 1}</div><div class="stat-value">${R(p)}</div></div>` : ''
    ).join('');
  }

  document.getElementById('statsRow').innerHTML =
    latestHtml +
    `<div class="stat"><div class="stat-label">Rata-rata</div><div class="stat-value">${R(avg)}</div></div>` +
    `<div class="stat"><div class="stat-label">Tertinggi</div><div class="stat-value">${R(hi)}</div></div>` +
    `<div class="stat"><div class="stat-label">Terendah</div><div class="stat-value">${R(lo)}</div></div>` +
    `<div class="stat"><div class="stat-label">Data</div><div class="stat-value">${dates.length} hari</div></div>`;
}

function renderChart() {
  const commodity = data.commodities[currentCommodity];
  if (!commodity) return;
  const allDates = Object.keys(commodity.prices).sort();
  const dates = getFilteredDates(allDates);
  const labels = dates.map(d => {
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: '2-digit' });
  });

  const numCols = commodity.columns ? commodity.columns.length : 0;
  const datasets = [];
  const legendBox = document.getElementById('legendBox');

  if (numCols > 0) {
    for (let i = 0; i < numCols; i++) {
      const values = dates.map(d => {
        const arr = commodity.prices[d];
        return arr && arr[i] != null ? arr[i] : null;
      });
      const colName = commodity.columns[i] || `Kolom ${i + 1}`;
      datasets.push({
        label: colName,
        data: values,
        borderColor: COLORS[i % COLORS.length],
        backgroundColor: 'transparent',
        tension: 0.3,
        pointRadius: dates.length < 100 ? 2 : 0,
        pointHoverRadius: 5,
        borderWidth: 2
      });
    }
    legendBox.innerHTML = commodity.columns.map((col, i) =>
      `<div class="legend-item"><span class="legend-dot" style="background:${COLORS[i % COLORS.length]}"></span>${col}</div>`
    ).join('');
  } else {
    const values = dates.map(d => {
      const arr = commodity.prices[d];
      return arr && arr[0] != null ? arr[0] : null;
    });
    datasets.push({
      label: currentCommodity,
      data: values,
      borderColor: COLORS[0],
      backgroundColor: 'transparent',
      tension: 0.3,
      pointRadius: dates.length < 100 ? 2 : 0,
      pointHoverRadius: 5,
      borderWidth: 2
    });
    legendBox.innerHTML = '';
  }

  const ctx = document.getElementById('priceChart').getContext('2d');
  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: datasets.length > 1, position: 'bottom', labels: { color: '#94a3b8', font: { size: 10 } } },
        tooltip: {
          backgroundColor: '#1e293b', titleColor: '#f1f5f9', bodyColor: '#94a3b8',
          borderColor: '#334155', borderWidth: 1,
          callbacks: { label: ctx => `${ctx.dataset.label}: ${R(ctx.parsed.y)}` }
        },
        zoom: {
          pan: { enabled: true, mode: 'x', modifierKey: null },
          zoom: {
            wheel: { enabled: true },
            pinch: { enabled: true },
            drag: { enabled: true, backgroundColor: 'rgba(56,189,248,0.1)', borderColor: 'rgba(56,189,248,0.5)', borderWidth: 1 },
            mode: 'x',
            onZoomComplete: () => { document.getElementById('resetZoomBtn').style.opacity = '1'; },
            onPanComplete: () => { document.getElementById('resetZoomBtn').style.opacity = '1'; }
          },
          limits: { x: { minRange: 3 } }
        }
      },
      scales: {
        x: { grid: { color: 'rgba(51,65,85,0.3)' }, ticks: { color: '#64748b', font: { size: 10 }, maxRotation: 45, autoSkip: true, maxTicksLimit: 15 } },
        y: { grid: { color: 'rgba(51,65,85,0.3)' }, ticks: { color: '#64748b', font: { size: 10 }, callback: v => v >= 1000000 ? (v/1000000).toFixed(1)+'jt' : v >= 1000 ? (v/1000).toFixed(0)+'rb' : v } }
      }
    }
  });

  document.getElementById('chartTitle').textContent = `Tren Harga ${currentCommodity}`;
  document.getElementById('chartSubtitle').textContent = `${dates.length} hari data produsen`;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    renderStats();
    renderChart();
  });
});

document.getElementById('resetZoomBtn').addEventListener('click', () => {
  if (chart) {
    chart.resetZoom();
    document.getElementById('resetZoomBtn').style.opacity = '0.5';
  }
});

async function init() {
  try {
    const resp = await fetch('data/produsen.json');
    if (!resp.ok) throw new Error('File tidak ditemukan');
    data = await resp.json();

    const commodities = Object.keys(data.commodities);
    currentCommodity = commodities[0];

    document.getElementById('updateBadge').textContent = `Update: ${new Date(data.lastUpdate).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}`;
    document.getElementById('commodityBadge').textContent = `${commodities.length} komoditas`;
    document.getElementById('resetZoomBtn').style.opacity = '0.5';

    renderTabs();
    renderStats();
    renderChart();
    showToast(`${commodities.length} komoditas dimuat`, 'success');
  } catch (e) {
    showToast('Gagal memuat data: ' + e.message, 'error');
  }
}

init();
</script>
</body>
</html>
