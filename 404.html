<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f172a">
  <title>Halaman tidak ditemukan | Harga Pangan Jatim</title>
  <link rel="icon" href="https://zeinzulaziz.github.io/harga-pangan/favicon.svg" type="image/svg+xml">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { color-scheme: dark; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a; color: #f1f5f9; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .card { max-width: 520px; text-align: center; }
    .code { font-size: clamp(3rem, 12vw, 4.5rem); font-weight: 800; color: #34d399; letter-spacing: -0.03em; line-height: 1; }
    h1 { font-size: 1.25rem; margin-top: 0.5rem; }
    .desc { color: #94a3b8; font-size: 0.95rem; margin-top: 0.6rem; }
    .actions { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem; }
    .btn {
      display: inline-flex; align-items: center; min-height: 44px; padding: 0.5rem 1rem;
      border-radius: 8px; border: 1px solid #334155; color: #cbd5e1;
      text-decoration: none; font-size: 0.9rem; font-weight: 600;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn:hover { border-color: #34d399; color: #f1f5f9; }
    .btn.primary { background: #34d399; border-color: #34d399; color: #0f172a; }
    .btn.primary:hover { background: #4ade80; border-color: #4ade80; }
    :focus-visible { outline: 2px solid #34d399; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>Halaman tidak ditemukan</h1>
    <p class="desc">Alamat yang kamu buka tidak ada atau sudah dipindah. Kembali ke dashboard untuk melihat tren harga, atau coba kalkulator waktu tanam.</p>
    <div class="actions">
      <a class="btn primary" href="https://zeinzulaziz.github.io/harga-pangan/">Buka dashboard</a>
      <a class="btn" href="https://zeinzulaziz.github.io/harga-pangan/tanam.html">Kalkulator waktu tanam</a>
    </div>
  </main>
</body>
</html>
