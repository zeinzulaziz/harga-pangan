name: Update Harga Pangan

on:
  schedule:
    # Setiap hari jam 14:00 WIB (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape SISKAPERBAPO Jatim
        run: node scripts/scrape-siskaperbapo.js

      - name: Update timestamp in index.html
        run: |
          TODAY=$(TZ=Asia/Jakarta date '+%d %B %Y')
          sed -i "s/Update: [0-9]* [A-Za-z]* [0-9]*/Update: $TODAY/g" index.html
          sed -i "s/Per [0-9]* [A-Za-z]* [0-9]* —/Per $TODAY —/g" index.html

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update harga pangan $(TZ=Asia/Jakarta date '+%Y-%m-%d')"
          git push
